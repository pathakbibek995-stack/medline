<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087f78">
  <title>No connection · Medicine Sales Manager</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5f8f8;color:#182e35;font:16px/1.6 system-ui,sans-serif;text-align:center}main{max-width:370px}.mark{display:grid;place-items:center;margin:0 auto 24px;width:64px;height:64px;background:#087f78;border-radius:18px;color:white;font-size:44px}h1{font-size:28px;letter-spacing:-.7px;margin:0 0 12px}p{color:#61777c;margin:0 0 24px}button{font:inherit;font-weight:600;min-height:48px;padding:10px 24px;border:0;border-radius:8px;background:#087f78;color:white;cursor:pointer}button:focus-visible{outline:3px solid #74c7bc;outline-offset:4px}small{display:block;color:#718087;margin-top:24px}
  </style>
</head>
<body>
  <main role="alert">
    <div class="mark" aria-hidden="true">+</div>
    <h1>No connection</h1>
    <p>Connect to the internet to open Medicine Sales Manager. Bills, payments and shop records require a connection.</p>
    <button onclick="location.reload()">Try again</button>
    <small>Medicine Sales Manager</small>
  </main>
  <script>window.addEventListener('online',()=>location.reload());</script>
</body>
</html>
